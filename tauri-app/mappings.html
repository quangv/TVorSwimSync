<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Symbol Mappings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            color: #333;
            font-weight: 600;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .mode-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }
        .mapping-section {
            margin-bottom: 20px;
        }
        .mapping-section label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 10px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-family: "SF Mono", "Monaco", "Menlo", monospace;
            font-size: 13px;
            color: #333;
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.15s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .hint {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        button.save {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        button.save:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button.save:active {
            opacity: 0.8;
            transform: translateY(0);
        }
        .status {
            font-size: 13px;
            color: #22c55e;
            text-align: center;
            height: 20px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Symbol Mappings</h1>

        <div class="section-title">Mode</div>
        <div class="mode-group">
            <button class="mode-btn" data-mode="off">Off</button>
            <button class="mode-btn" data-mode="long">Long</button>
            <button class="mode-btn" data-mode="short">Short</button>
        </div>

        <div class="mapping-section">
            <label>Long Mappings</label>
            <textarea id="long-mappings" placeholder="TSLA:TSLR&#10;NVDA:NVDL&#10;AAPL:AAPU"></textarea>
            <div class="hint">One pair per line: BASE:MAPPED (e.g. TSLA:TSLR)</div>
        </div>

        <div class="mapping-section">
            <label>Short Mappings</label>
            <textarea id="short-mappings" placeholder="TSLA:TSLS&#10;NVDA:NVDS"></textarea>
            <div class="hint">One pair per line: BASE:MAPPED (e.g. TSLA:TSLS)</div>
        </div>

        <div class="actions">
            <button class="save" id="save-btn">Save</button>
        </div>
        <div class="status" id="status">Saved!</div>
    </div>

    <script>
        const invoke = window.__TAURI__?.core?.invoke;
        let currentMode = "off";

        document.querySelectorAll(".mode-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                currentMode = btn.dataset.mode;
                document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });

        async function load() {
            try {
                const m = await invoke("load_mappings");
                currentMode = m.mode || "off";
                document.getElementById("long-mappings").value = m.long_mappings || "";
                document.getElementById("short-mappings").value = m.short_mappings || "";
                document.querySelectorAll(".mode-btn").forEach(b => {
                    b.classList.toggle("active", b.dataset.mode === currentMode);
                });
            } catch (e) {
                console.error("load_mappings failed", e);
            }
        }

        document.getElementById("save-btn").addEventListener("click", async () => {
            try {
                await invoke("save_mappings", {
                    mappings: {
                        mode: currentMode,
                        long_mappings: document.getElementById("long-mappings").value,
                        short_mappings: document.getElementById("short-mappings").value,
                    }
                });
                const status = document.getElementById("status");
                status.classList.add("visible");
                setTimeout(() => status.classList.remove("visible"), 1500);
            } catch (e) {
                alert("Failed to save: " + e);
            }
        });

        document.querySelectorAll("textarea").forEach(ta => {
            ta.addEventListener("keydown", (e) => {
                if (e.metaKey || e.ctrlKey) {
                    if (e.key === "a") { e.preventDefault(); ta.select(); }
                    else if (e.key === "c") { document.execCommand("copy"); }
                    else if (e.key === "v") { document.execCommand("paste"); }
                    else if (e.key === "x") { document.execCommand("cut"); }
                    else if (e.key === "z") { e.shiftKey ? document.execCommand("redo") : document.execCommand("undo"); }
                }
            });
        });

        load();
    </script>
</body>
</html>
